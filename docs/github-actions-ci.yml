# CI definition for semantic-cache-platform.
# NOTE: this file is shipped here (not .github/workflows/ci.yml) because
# the GitHub App integration used to push this project cannot write to
# .github/workflows/. To activate CI, move it to .github/workflows/ci.yml.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src pytest tests/ -q
      - run: PYTHONPATH=src python -m semantic_cache.cli eval
